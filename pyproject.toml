[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "akceleracja-triton"
version = "0.1.0"
description = "GPU acceleration and custom kernels using OpenAI Triton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "triton-windows",
    "pytest",
    "tabulate",
    "matplotlib",
    "ipykernel",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v -ra"
pythonpath = [
    "."
]
testpaths = [
    "tests",
]
